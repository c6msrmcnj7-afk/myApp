name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: JVM unit tests plus the JS target.
  test-jvm:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run recipes tests
        run: ./gradlew :recipes:jvmTest --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: recipes/build/reports/tests/jvmTest

  # Android artifact plus host tests, which run on the JVM.
  test-android:
    name: Android library + host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Android library
        run: ./gradlew :recipes:assemble --console=plain

      - name: Run Android host tests
        run: ./gradlew :recipes:testAndroid --console=plain

  # iOS compilation and tests on Apple silicon.
  test-ios:
    name: iOS tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: ./gradlew :recipes:iosSimulatorArm64Test --console=plain
